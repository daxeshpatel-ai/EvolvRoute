<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <!-- background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070d"/>
      <stop offset="1" stop-color="#0d0b18"/>
    </linearGradient>
    <!-- node purple gradient -->
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a779ff"/>
      <stop offset="1" stop-color="#5b34a8"/>
    </linearGradient>
    <!-- selected/bright node gradient -->
    <linearGradient id="nodeHot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a6ff"/>
      <stop offset="1" stop-color="#7a4cd6"/>
    </linearGradient>
    <!-- dim node gradient (not chosen) -->
    <linearGradient id="nodeDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3d6b"/>
      <stop offset="1" stop-color="#2c2440"/>
    </linearGradient>
    <!-- orange feedback gradient -->
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb877"/>
      <stop offset="1" stop-color="#ff9d4d"/>
    </linearGradient>
    <!-- soft purple glow -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowHot" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowOrange" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c6390"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff9d4d"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- faint perspective grid -->
  <g stroke="#1c1830" stroke-width="1" opacity="0.55">
    <!-- horizontal lines -->
    <line x1="0" y1="640" x2="1600" y2="640"/>
    <line x1="0" y1="700" x2="1600" y2="700"/>
    <line x1="0" y1="770" x2="1600" y2="770"/>
    <line x1="0" y1="850" x2="1600" y2="850"/>
    <!-- converging verticals (perspective toward a high vanishing point) -->
    <g>
      <line x1="-200" y1="900" x2="640" y2="600"/>
      <line x1="120" y1="900" x2="700" y2="600"/>
      <line x1="440" y1="900" x2="760" y2="600"/>
      <line x1="800" y1="900" x2="800" y2="600"/>
      <line x1="1160" y1="900" x2="840" y2="600"/>
      <line x1="1480" y1="900" x2="900" y2="600"/>
      <line x1="1800" y1="900" x2="960" y2="600"/>
    </g>
  </g>
  <!-- faint upper grid -->
  <g stroke="#15121f" stroke-width="1" opacity="0.4">
    <line x1="0" y1="120" x2="1600" y2="120"/>
    <line x1="0" y1="60" x2="1600" y2="60"/>
  </g>

  <!-- ===== TITLE ===== -->
  <text x="60" y="62" fill="#ffffff" font-size="34" font-weight="700">EvolvRoute</text>
  <text x="60" y="92" fill="#b9a8e8" font-size="18" font-weight="500">learned single-best routing &#160;&#160;<tspan fill="#7d7298">(cf. OpenRouter Fusion: parallel ensemble + judge)</tspan></text>

  <!-- stage band labels -->
  <g fill="#5b5276" font-size="13" font-weight="600" letter-spacing="1.5">
    <text x="150" y="160" text-anchor="middle">1 · TASK</text>
    <text x="430" y="160" text-anchor="middle">2 · GEOMETRIC ROUTER</text>
    <text x="800" y="160" text-anchor="middle">3 · WORKER LANES (route ONE)</text>
    <text x="1150" y="160" text-anchor="middle">4 · INTEGRATE + VERDICT</text>
    <text x="1430" y="160" text-anchor="middle">5 · OUTCOME &amp; LEARNING</text>
  </g>

  <!-- ============================================================= -->
  <!-- STAGE 1: TASK (speech bubble)                                  -->
  <!-- ============================================================= -->
  <g filter="url(#glow)">
    <path d="M70,360 h160 a16,16 0 0 1 16,16 v92 a16,16 0 0 1 -16,16 h-92 l-30,30 v-30 h-38 a16,16 0 0 1 -16,-16 v-92 a16,16 0 0 1 16,-16 z"
          fill="url(#node)" stroke="#c9a6ff" stroke-width="1.5"/>
  </g>
  <text x="150" y="408" fill="#ffffff" font-size="26" font-weight="700" text-anchor="middle">Task</text>
  <text x="150" y="438" fill="#e7ddff" font-size="13" text-anchor="middle">from Claude</text>
  <text x="150" y="456" fill="#e7ddff" font-size="13" text-anchor="middle">(controller)</text>

  <!-- arrow Task -> Router -->
  <line x1="252" y1="420" x2="332" y2="420" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ============================================================= -->
  <!-- STAGE 2: GEOMETRIC ROUTER (brain + gears)                      -->
  <!-- ============================================================= -->
  <g filter="url(#glow)">
    <rect x="340" y="350" width="180" height="140" rx="18" fill="url(#node)" stroke="#c9a6ff" stroke-width="1.5"/>
  </g>
  <!-- brain glyph -->
  <g transform="translate(430,392)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
    <path d="M-22,4 a14,14 0 0 1 6,-22 a12,12 0 0 1 16,-2 a12,12 0 0 1 16,2 a14,14 0 0 1 6,22 a12,12 0 0 1 -6,16 a12,12 0 0 1 -16,4 a12,12 0 0 1 -16,-4 a12,12 0 0 1 -6,-16 z"/>
    <line x1="0" y1="-22" x2="0" y2="22"/>
    <path d="M-12,-6 q6,4 12,0"/>
    <path d="M0,8 q6,-4 12,-2"/>
  </g>
  <!-- gear glyph -->
  <g transform="translate(474,432)" fill="#ffffff">
    <circle cx="0" cy="0" r="7"/>
    <g>
      <rect x="-2" y="-14" width="4" height="6"/>
      <rect x="-2" y="8" width="4" height="6"/>
      <rect x="-14" y="-2" width="6" height="4"/>
      <rect x="8" y="-2" width="6" height="4"/>
    </g>
    <circle cx="0" cy="0" r="3" fill="#5b34a8"/>
  </g>
  <text x="430" y="476" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">Geometric Router</text>
  <text x="430" y="338" fill="#e7ddff" font-size="13" text-anchor="middle" font-weight="500">embed (model2vec) + score</text>

  <!-- side node: gates feeding router (analogue of search+bash) -->
  <g filter="url(#glow)">
    <rect x="350" y="560" width="200" height="74" rx="14" fill="url(#nodeDim)" stroke="#8a7bc0" stroke-width="1.3"/>
  </g>
  <!-- shield glyph -->
  <g transform="translate(382,597)" fill="none" stroke="#d9ccff" stroke-width="2">
    <path d="M0,-12 l11,4 v8 q0,9 -11,14 q-11,-5 -11,-14 v-8 z" fill="#3a2f57"/>
    <path d="M-5,0 l3,4 l7,-8" stroke-width="2.4"/>
  </g>
  <text x="468" y="591" fill="#e7ddff" font-size="13" font-weight="600" text-anchor="middle">Quota · Spend</text>
  <text x="468" y="609" fill="#e7ddff" font-size="13" font-weight="600" text-anchor="middle">Sandbox gates</text>
  <!-- gates -> router (feed in) -->
  <line x1="445" y1="558" x2="440" y2="494" stroke="#9a8cc8" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#arrow)"/>

  <!-- router -> lanes (fan out): three dim dashed, one bright solid -->
  <!-- to codex (dim) -->
  <path d="M524,400 C610,330 690,300 760,295" fill="none" stroke="#6c6390" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowDim)" opacity="0.8"/>
  <!-- to agy (SELECTED - bright solid) -->
  <path d="M524,418 C620,420 690,420 760,420" fill="none" stroke="#ffffff" stroke-width="3.5" marker-end="url(#arrow)"/>
  <!-- to grok (dim) -->
  <path d="M524,440 C610,510 690,545 760,548" fill="none" stroke="#6c6390" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowDim)" opacity="0.8"/>
  <!-- to claude_keep (dim) -->
  <path d="M524,455 C600,600 660,650 760,668" fill="none" stroke="#6c6390" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowDim)" opacity="0.8"/>

  <!-- ============================================================= -->
  <!-- STAGE 3: WORKER LANES (4 robot heads, one selected)            -->
  <!-- ============================================================= -->

  <!-- robot head template drawn inline per lane -->
  <!-- LANE 1: codex (dim) -->
  <g opacity="0.5">
    <g filter="url(#glow)">
      <rect x="762" y="256" width="150" height="80" rx="16" fill="url(#nodeDim)" stroke="#6c6390" stroke-width="1.3"/>
    </g>
    <!-- antenna -->
    <line x1="800" y1="256" x2="800" y2="240" stroke="#9a8cc8" stroke-width="2.2"/>
    <circle cx="800" cy="236" r="4" fill="#9a8cc8"/>
    <!-- eyes -->
    <circle cx="788" cy="290" r="6" fill="#cfc3f0"/>
    <circle cx="816" cy="290" r="6" fill="#cfc3f0"/>
    <!-- mouth -->
    <rect x="785" y="306" width="34" height="4" rx="2" fill="#9a8cc8"/>
    <text x="876" y="296" fill="#cdbff0" font-size="17" font-weight="700">codex</text>
  </g>

  <!-- LANE 2: agy (SELECTED - bright) -->
  <g>
    <g filter="url(#glowHot)">
      <rect x="762" y="378" width="150" height="84" rx="16" fill="url(#nodeHot)" stroke="#ffffff" stroke-width="2.4"/>
    </g>
    <line x1="800" y1="378" x2="800" y2="360" stroke="#ffffff" stroke-width="2.6"/>
    <circle cx="800" cy="356" r="5" fill="#ffffff"/>
    <circle cx="788" cy="414" r="7" fill="#ffffff"/>
    <circle cx="816" cy="414" r="7" fill="#ffffff"/>
    <rect x="784" y="432" width="36" height="5" rx="2.5" fill="#ffffff"/>
    <text x="880" y="420" fill="#ffffff" font-size="19" font-weight="800">agy</text>
    <!-- SELECTED badge -->
    <g>
      <rect x="762" y="466" width="150" height="22" rx="11" fill="#1a1430" stroke="#ffd9a8" stroke-width="1"/>
      <text x="837" y="481" fill="#ffd9a8" font-size="12" font-weight="700" text-anchor="middle">★ SELECTED LANE</text>
    </g>
  </g>

  <!-- LANE 3: grok (dim) -->
  <g opacity="0.5">
    <g filter="url(#glow)">
      <rect x="762" y="510" width="150" height="80" rx="16" fill="url(#nodeDim)" stroke="#6c6390" stroke-width="1.3"/>
    </g>
    <line x1="800" y1="510" x2="800" y2="494" stroke="#9a8cc8" stroke-width="2.2"/>
    <circle cx="800" cy="490" r="4" fill="#9a8cc8"/>
    <circle cx="788" cy="544" r="6" fill="#cfc3f0"/>
    <circle cx="816" cy="544" r="6" fill="#cfc3f0"/>
    <rect x="785" y="560" width="34" height="4" rx="2" fill="#9a8cc8"/>
    <text x="876" y="550" fill="#cdbff0" font-size="17" font-weight="700">grok</text>
  </g>

  <!-- LANE 4: claude_keep (dim) -->
  <g opacity="0.5">
    <g filter="url(#glow)">
      <rect x="762" y="632" width="150" height="80" rx="16" fill="url(#nodeDim)" stroke="#6c6390" stroke-width="1.3"/>
    </g>
    <line x1="800" y1="632" x2="800" y2="616" stroke="#9a8cc8" stroke-width="2.2"/>
    <circle cx="800" cy="612" r="4" fill="#9a8cc8"/>
    <circle cx="788" cy="666" r="6" fill="#cfc3f0"/>
    <circle cx="816" cy="666" r="6" fill="#cfc3f0"/>
    <rect x="785" y="682" width="34" height="4" rx="2" fill="#9a8cc8"/>
    <text x="876" y="672" fill="#cdbff0" font-size="16" font-weight="700">claude_keep</text>
  </g>

  <!-- fallback (1 hop) curved arrow between agy and codex lanes -->
  <path d="M748,400 C700,360 700,320 748,300" fill="none" stroke="#9a8cc8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowDim)"/>
  <text x="660" y="350" fill="#9a8cc8" font-size="12" font-weight="600" text-anchor="middle">fallback</text>
  <text x="660" y="366" fill="#9a8cc8" font-size="12" font-weight="600" text-anchor="middle">(1 hop)</text>

  <!-- selected lane -> integrate/verdict (bright) -->
  <path d="M914,420 C970,420 1000,420 1042,420" fill="none" stroke="#ffffff" stroke-width="3.5" marker-end="url(#arrow)"/>

  <!-- ============================================================= -->
  <!-- STAGE 4: CLAUDE INTEGRATES + VERDICT (gavel)                   -->
  <!-- ============================================================= -->
  <g filter="url(#glow)">
    <rect x="1044" y="350" width="190" height="140" rx="18" fill="url(#node)" stroke="#c9a6ff" stroke-width="1.5"/>
  </g>
  <!-- gavel glyph -->
  <g transform="translate(1139,396)" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="#ffffff">
    <!-- mallet head -->
    <g transform="rotate(-40)">
      <rect x="-18" y="-9" width="36" height="18" rx="4" fill="#ffffff" stroke="none"/>
      <line x1="0" y1="9" x2="0" y2="34"/>
    </g>
    <!-- sound block -->
    <rect x="-28" y="34" width="56" height="8" rx="3" fill="#ffffff" stroke="none"/>
  </g>
  <text x="1139" y="468" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Claude integrates</text>
  <text x="1139" y="338" fill="#e7ddff" font-size="13" text-anchor="middle" font-weight="500">accept / edit / reject</text>

  <!-- note under gavel -->
  <text x="1139" y="512" fill="#8579ad" font-size="11.5" text-anchor="middle" font-style="italic">judges 1 worker · not N parallel</text>

  <!-- integrate -> outcome -->
  <line x1="1234" y1="420" x2="1296" y2="420" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ============================================================= -->
  <!-- STAGE 5: OUTCOME & LEARNING (stacked list)                     -->
  <!-- ============================================================= -->
  <g filter="url(#glow)">
    <rect x="1300" y="288" width="252" height="264" rx="18" fill="url(#node)" stroke="#c9a6ff" stroke-width="1.5"/>
  </g>
  <text x="1426" y="324" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">Outcome</text>
  <g font-size="15" fill="#ffffff" font-weight="600">
    <g transform="translate(1322,352)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#e7ddff"/>
      <text x="26" y="12">Routed result</text>
    </g>
    <g transform="translate(1322,392)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#e7ddff"/>
      <text x="26" y="12">Verdict logged</text>
    </g>
    <g transform="translate(1322,432)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#e7ddff"/>
      <text x="26" y="12">Centroids updated</text>
    </g>
    <g transform="translate(1322,472)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#e7ddff"/>
      <text x="26" y="12">Stop-cells</text>
    </g>
    <g transform="translate(1322,512)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#ffd9a8"/>
      <text x="26" y="12" fill="#ffd9a8">Cost saved</text>
    </g>
  </g>

  <!-- ============================================================= -->
  <!-- STAGE 6: FEEDBACK LOOP (orange, outcome -> router)             -->
  <!-- ============================================================= -->
  <g filter="url(#glowOrange)">
    <path d="M1300,555 C1180,640 1120,792 905,792 C620,792 460,792 430,792 C400,792 430,640 430,500"
          fill="none" stroke="url(#orange)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowOrange)"/>
  </g>
  <!-- label on the orange loop -->
  <rect x="690" y="772" width="430" height="40" rx="14" fill="#1a1206" stroke="#ff9d4d" stroke-width="1.2"/>
  <text x="905" y="797" fill="#ffb877" font-size="15" font-weight="700" text-anchor="middle">self-learning loop&#160;&#160;ledger → ingest → re-embed</text>

  <!-- ============================================================= -->
  <!-- LEGEND                                                         -->
  <!-- ============================================================= -->
  <g transform="translate(1300,600)">
    <rect x="0" y="0" width="252" height="120" rx="12" fill="#0e0c1a" stroke="#2a2440" stroke-width="1"/>
    <text x="16" y="26" fill="#8d82b0" font-size="12" font-weight="700" letter-spacing="1">LEGEND</text>
    <!-- selected -->
    <line x1="16" y1="48" x2="56" y2="48" stroke="#ffffff" stroke-width="3.5" marker-end="url(#arrow)"/>
    <text x="68" y="52" fill="#d9ccff" font-size="12.5">solid bright = selected lane</text>
    <!-- not chosen -->
    <line x1="16" y1="76" x2="56" y2="76" stroke="#6c6390" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowDim)"/>
    <text x="68" y="80" fill="#d9ccff" font-size="12.5">dashed dim = not chosen</text>
    <!-- orange -->
    <line x1="16" y1="104" x2="56" y2="104" stroke="#ff9d4d" stroke-width="3.5" marker-end="url(#arrowOrange)"/>
    <text x="68" y="108" fill="#d9ccff" font-size="12.5">orange = learning feedback</text>
  </g>

  <!-- footer caption -->
  <text x="60" y="864" fill="#5b5276" font-size="13" font-style="italic">Fusion runs many models in parallel + a judge fuses them; EvolvRoute routes to the single best-fit worker and learns who that is over time.</text>
</svg>
